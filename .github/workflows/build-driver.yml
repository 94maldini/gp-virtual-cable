name: build-driver

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      - name: NuGet restore
        run: nuget restore driver\packages.config -PackagesDirectory driver\packages

      - name: Cari msbuild
        shell: pwsh
        run: |
          $ms = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          Write-Host "msbuild: $ms"
          "MSBUILD=$ms" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Debug x64 dengan NT_TARGET_VERSION 0x0A000008
        shell: pwsh
        run: |
          & $env:MSBUILD driver\SimpleAudioSample.sln /p:Configuration=Debug /p:Platform=x64 /p:_NT_TARGET_VERSION=0x0A000008 /v:minimal /fl "/flp:logfile=msbuild.log;verbosity=detailed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bukti _NT_TARGET_VERSION di command line cl
        shell: pwsh
        run: |
          Select-String -Path msbuild.log -Pattern '_NT_TARGET_VERSION' | Select-Object -First 6 | ForEach-Object { $_.Line.Trim().Substring(0, [Math]::Min(400, $_.Line.Trim().Length)) }

      - name: Diagnostik hasil build
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem driver -Recurse -Include *.sys,*.inf,*.cat,*.cer,*.pfx | ForEach-Object { "{0}  {1}" -f $_.FullName, $_.Length }
          Get-ChildItem driver\packages -Recurse -Filter devcon.exe | ForEach-Object { "devcon: " + $_.FullName }

      - name: Kumpulkan artefak
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          $pkg = Get-ChildItem driver -Recurse -Filter SimpleAudioSample.sys | Where-Object { $_.DirectoryName -like '*package*' } | Select-Object -First 1
          if (-not $pkg) { throw 'SimpleAudioSample.sys di folder package tidak ditemukan' }
          Write-Host "package dir: $($pkg.DirectoryName)"
          Copy-Item "$($pkg.DirectoryName)\*" stage -Recurse -Force
          $cer = Get-ChildItem driver -Recurse -Filter *.cer | Select-Object -First 1
          if ($cer) { Copy-Item $cer.FullName stage -Force } else { Write-Host 'PERINGATAN: .cer tidak ditemukan' }
          $dev = Get-ChildItem driver\packages -Recurse -Filter devcon.exe | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if ($dev) { Write-Host "devcon dari NuGet: $($dev.FullName)"; Copy-Item $dev.FullName stage -Force } else { Write-Host 'devcon.exe tidak ada di paket NuGet' }
          Get-ChildItem stage -Recurse | ForEach-Object { '{0}  {1}' -f $_.FullName, $_.Length }
          Get-ChildItem stage\*.cat | ForEach-Object { Get-AuthenticodeSignature $_.FullName | Format-List Status,StatusMessage,SignerCertificate }

      - uses: actions/upload-artifact@v4
        with:
          name: gp-virtual-cable-driver
          path: stage
          if-no-files-found: error
