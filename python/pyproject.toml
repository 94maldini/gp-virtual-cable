[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpcable"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "sounddevice", "pycaw"]

[project.scripts]
gp-meter = "gpcable.meter:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["gpcable*"]

[tool.setuptools.package-data]
gpcable = ["templates/*.in"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end loopback tests, need the GP Virtual Cable driver installed"]
